<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure 8.2 - How the Scaling Loop Works</title>
<style>
  body { margin: 0; background: #fff; color: #000; font-family: "Times New Roman", Times, serif; }
  .wrap { max-width: 720px; margin: 24px auto; padding: 16px; }
  svg { width: 100%; height: auto; display: block; }
  .cap { text-align: center; font-size: 14px; margin-top: 8px; }
  @media print { .wrap { margin: 0; } }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fff"/>

  <!-- Kubernetes cluster boundary -->
  <rect x="20" y="20" width="600" height="420" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="34" y="44" font-size="14" font-weight="bold">Kubernetes cluster</text>

  <!-- Step 1: metrics -->
  <rect x="50" y="90" width="160" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="130" y="120" font-size="15" font-weight="bold" text-anchor="middle">1. Metrics</text>
  <text x="130" y="142" font-size="13" text-anchor="middle">CPU, memory, requests</text>

  <!-- Step 2: LoadPredictor -->
  <rect x="240" y="90" width="160" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="320" y="120" font-size="15" font-weight="bold" text-anchor="middle">2. LoadPredictor</text>
  <text x="320" y="142" font-size="13" text-anchor="middle">estimates future demand</text>

  <!-- Step 3: ScalingEngine -->
  <rect x="430" y="90" width="160" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="510" y="120" font-size="15" font-weight="bold" text-anchor="middle">3. ScalingEngine</text>
  <text x="510" y="142" font-size="13" text-anchor="middle">replicas within limits</text>

  <!-- arrows across the top -->
  <line x1="210" y1="130" x2="236" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="130" x2="426" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Policy check (below ScalingEngine) -->
  <rect x="430" y="230" width="160" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="510" y="260" font-size="15" font-weight="bold" text-anchor="middle">Policy and SLO</text>
  <text x="510" y="282" font-size="13" text-anchor="middle">min / max, latency target</text>
  <line x1="510" y1="170" x2="510" y2="226" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: Kubernetes API (bottom) -->
  <rect x="240" y="330" width="160" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="320" y="360" font-size="15" font-weight="bold" text-anchor="middle">4. Kubernetes API</text>
  <text x="320" y="382" font-size="13" text-anchor="middle">applies replica count</text>
  <line x1="510" y1="300" x2="510" y2="365" stroke="#000" stroke-width="2"/>
  <line x1="510" y1="365" x2="404" y2="365" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Feedback to metrics -->
  <line x1="320" y1="330" x2="320" y2="200" stroke="#000" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="320" y1="200" x2="130" y2="200" stroke="#000" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="130" y1="200" x2="130" y2="174" stroke="#000" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="200" y="192" font-size="13" text-anchor="middle">pods report new load</text>

  <!-- Pods box -->
  <rect x="50" y="330" width="160" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="130" y="360" font-size="15" font-weight="bold" text-anchor="middle">Pods</text>
  <text x="130" y="382" font-size="13" text-anchor="middle">workload running</text>

  <!-- Feedback label -->
  <text x="320" y="420" font-size="13" text-anchor="middle">Loop repeats every few seconds</text>
</svg>
<p class="cap"><b>Figure 8.2</b> The scaling loop: metrics feed the LoadPredictor, the ScalingEngine applies policy, and the Kubernetes API changes the replica count.</p>
</div>
</body>
</html>
